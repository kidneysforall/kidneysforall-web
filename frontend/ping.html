<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Ping Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }
        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .endpoint-badge {
            background-color: #e9ecef;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.85rem;
            color: #495057;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            font-weight: 500;
            display: none;
            word-break: break-word;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>API Connection Test</h1>
    <p>Verify that your local Azure Functions background runtime is actively listening.</p>
    
    <div id="endpointDisplay" class="endpoint-badge">GET /api/ping</div>
    
    <button id="pingBtn">Send Ping Request</button>
    
    <div id="statusBox" class="status-box"></div>
</div>

<!-- Shift to module format to import configuration states safely -->
<script type="module">
    import { APP_CONFIG } from './js/config.js';

    const pingBtn = document.getElementById('pingBtn');
    const endpointDisplay = document.getElementById('endpointDisplay');

    // Display active gateway routing block dynamically
    endpointDisplay.innerText = `GET ${APP_CONFIG.BASE_URL}/api/ping`;

    // Programmatic event registration
    pingBtn.addEventListener('click', testPing);

    async function testPing() {
        const statusBox = document.getElementById('statusBox');
        
        // Reset states
        pingBtn.disabled = true;
        pingBtn.innerText = 'Pinging...';
        statusBox.style.display = 'none';
        statusBox.className = 'status-box';
        
        try {
            // Hit the dynamic environment route cleanly
            const response = await fetch(`${APP_CONFIG.BASE_URL}/api/ping`);
            
            if (response.ok) {
                const data = await response.text(); 
                statusBox.classList.add('success');
                statusBox.innerHTML = `<strong>Connected!</strong> Backend responded with: "${data}" (Status ${response.status})`;
            } else {
                statusBox.classList.add('error');
                statusBox.innerHTML = `<strong>Server Error:</strong> Returned status ${response.status}`;
            }
        } catch (error) {
            // Updated description to match your modern Node.js and SWA CLI environment
            statusBox.classList.add('error');
            statusBox.innerHTML = `<strong>Connection Failed:</strong> Could not reach the API gateway. Make sure your local "swa start" runtime pipeline is running smoothly.`;
        } finally {
            // Restore button state
            pingBtn.disabled = false;
            pingBtn.innerText = 'Send Ping Request';
            statusBox.style.display = 'block';
        }
    }
</script>

</body>
</html>
