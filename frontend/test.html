<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure SWA Reader</title>
</head>
<body>

    <h1>Cosmos DB Items via Serverless API</h1>
    <button id="load-btn">Fetch Data Securely</button>
    
    <div id="output" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace;"></div>

    <script>
        document.getElementById('load-btn').addEventListener('click', async () => {
            const outputDiv = document.getElementById('output');
            outputDiv.textContent = "Requesting data via secure backend API...";

            try {
                // SWA maps this automatically to your Azure function
                const response = await fetch('/api/GetCosmosData');
                
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `HTTP status ${response.status}`);
                }
                
                const data = await response.json();
                outputDiv.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                outputDiv.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
