<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Circle | Kidneys For All</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { color: #2c3e50; line-height: 1.6; background-color: #f8fafc; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-home { color: #0d9488; text-decoration: none; font-weight: 500; }
        .lang-selectors { display: flex; gap: 6px; font-size: 14px; align-items: center; }
        .lang-switch { cursor: pointer; color: #64748b; text-decoration: none; font-weight: bold; background: none; border: none; font: inherit; padding: 0; }
        .lang-switch:hover, .lang-switch.active { color: #0d9488; text-decoration: underline; }
        .form-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; border-top: 4px solid #f59e0b; }
        h1 { font-size: 28px; color: #1e293b; margin-bottom: 10px; }
        p.intro { color: #64748b; margin-bottom: 30px; font-size: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; color: #334155; background-color: #ffffff; }
        input:focus, select:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
        button[type="submit"] { background-color: #f59e0b; color: #1e293b; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 10px; transition: background-color 0.3s; }
        button[type="submit"]:hover { background-color: #d97706; }
        #statusMessage { margin-top: 20px; font-weight: bold; text-align: center; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrap">
            <a href="index.html" class="back-home" data-i18n="back_home">← Back to Homepage</a>
            <div class="lang-selectors">
                <button class="lang-switch" data-lang="en">EN</button>
                <span>|</span>
                <button class="lang-switch" data-lang="es">ES</button>
            </div>
        </div>
        <div class="form-card">
            <h1 data-i18n="circle_title">Join the Support Circle</h1>
            <p class="intro" data-i18n="circle_subtitle">Lend your time, your voice, or your skills to ensure no kidney patient has to navigate chronic illness alone.</p>
            <form id="circleForm">
                <div class="form-group">
                    <label for="fullName" data-i18n="lbl_fullname">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="lbl_email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="roleInterest" data-i18n="lbl_interest">Area of Interest</label>
                    <select id="roleInterest" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="companion" data-i18n="opt_vol_comp">Volunteer Treatment Companion</option>
                        <option value="advocate" data-i18n="opt_grass_adv">Grassroots Advocacy / Awareness Builder</option>
                        <option value="post-op-helper" data-i18n="opt_post_pod">Localized Post-Op Support Pods</option>
                    </select>
                </div>
                <button type="submit" data-i18n="btn_submit_circle">Submit Circle Registration</button>
            </form>
            <p id="statusMessage"></p>
        </div>
    </div>

    <script type="module" src="./js/i18n.js"></script>
    <script type="module">
        // Submit form data collection handler
        document.getElementById('circleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.style.color = "#475569";
            statusMessage.innerText = "Submitting registration details...";

            const formData = {
                docType: "submission",
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: "Not Provided",
                message: `Registered Track Interest: ${document.getElementById('roleInterest').value}`
            };

            try {
                // Simplified relative API pathway optimized for Azure Static Web Apps proxy routing
                const response = await fetch('/api/submitForm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok) {
                    statusMessage.style.color = "#0d9488";
                    statusMessage.innerText = "✓ Success! Registration Captured.";
                    document.getElementById('circleForm').reset();
                } else {
                    statusMessage.style.color = "#b91c1c";
                    statusMessage.innerText = `Rejected: ${result.error || 'Unknown API issue.'}`;
                }
            } catch (err) {
                statusMessage.style.color = "#b91c1c";
                statusMessage.innerText = "Network failure connecting to backend service.";
            }
        });

        // Programmatic Language Toggle Action Wireup
        document.querySelectorAll('.lang-switch').forEach(button => {
            button.addEventListener('click', (e) => {
                const targetLang = e.target.getAttribute('data-lang');
                localStorage.setItem('preferredLanguage', targetLang);
                window.location.reload();
            });
            
            // Highlight current locale selection
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            if (button.getAttribute('data-lang') === currentLang) {
                button.classList.add('active');
            }
        });
    </script>
</body>
</html>
