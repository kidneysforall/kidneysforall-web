<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Social Support | Kidneys For All</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { color: #2c3e50; line-height: 1.6; background-color: #f8fafc; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-home { color: #0d9488; text-decoration: none; font-weight: 500; }
        .lang-selectors { display: flex; gap: 6px; font-size: 14px; align-items: center; }
        .lang-switch { cursor: pointer; color: #64748b; text-decoration: none; font-weight: bold; background: none; border: none; font: inherit; padding: 0; }
        .lang-switch:hover, .lang-switch.active { color: #0d9488; text-decoration: underline; }
        .form-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; border-top: 4px solid #0d9488; }
        h1 { font-size: 28px; color: #1e293b; margin-bottom: 10px; }
        p.intro { color: #64748b; margin-bottom: 30px; font-size: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
        input[type="text"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; color: #334155; background-color: #ffffff; }
        input:focus, select:focus { border-color: #0d9488; outline: none; box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15); }
        button[type="submit"] { background-color: #0d9488; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 10px; transition: background-color 0.3s; }
        button[type="submit"]:hover { background-color: #0f766e; }
        #statusMessage { margin-top: 20px; font-weight: bold; text-align: center; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrap">
            <a href="index.html" class="back-home" data-i18n="back_home">← Back to Homepage</a>
            <div class="lang-selectors">
                <button class="lang-switch" data-lang="en">EN</button>
                <span>|</span>
                <button class="lang-switch" data-lang="es">ES</button>
            </div>
        </div>
        <div class="form-card">
            <h1 data-i18n="sup_title">Request Social Support</h1>
            <p class="intro" data-i18n="sup_subtitle">If you or a loved one are navigating kidney disease without a localized support system, let us help build your care circle.</p>
            <form id="supportForm">
                <div class="form-group">
                    <label for="fullName" data-i18n="lbl_fullname">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="lbl_email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="primaryNeed" data-i18n="lbl_need">Primary Support Needed</label>
                    <select id="primaryNeed" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="companionship" data-i18n="opt_comp_trans">Treatment Companionship / Transport</option>
                        <option value="advocacy" data-i18n="opt_surr_adv">Surrogate Advocacy / Donor Campaigning</option>
                        <option value="post-op" data-i18n="opt_post_op">Post-Op Prep Circle (Recovery Assistance)</option>
                        <option value="other" data-i18n="opt_general">General Peer Support Network</option>
                    </select>
                </div>
                <button type="submit" data-i18n="btn_submit_sup">Submit Support Request</button>
            </form>
            <p id="statusMessage"></p>
        </div>
    </div>

    <script type="module" src="./js/i18n.js"></script>
    <script type="module">
        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.style.color = "#475569";
            statusMessage.innerText = "Transmitting support request details...";

            const formData = {
                docType: "submission",
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: "Not Provided",
                message: `Patient Support Requirement Track: ${document.getElementById('primaryNeed').value}`
            };

            try {
                // Using the standardized relative endpoint mapped directly via Azure SWA proxy
                const response = await fetch('/api/submitForm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok) {
                    statusMessage.style.color = "#0d9488";
                    statusMessage.innerText = "✓ Request Submitted Successfully.";
                    document.getElementById('supportForm').reset();
                } else {
                    statusMessage.style.color = "#b91c1c";
                    statusMessage.innerText = `Rejected: ${result.error || 'Unknown API issue.'}`;
                }
            } catch (err) {
                statusMessage.style.color = "#b91c1c";
                statusMessage.innerText = "Network failure connecting to backend service.";
            }
        });

        // Programmatic Language Toggle Action Wireup
        document.querySelectorAll('.lang-switch').forEach(button => {
            button.addEventListener('click', (e) => {
                const targetLang = e.target.getAttribute('data-lang');
                localStorage.setItem('preferredLanguage', targetLang);
                window.location.reload();
            });
            
            // Highlight current locale selection
            const currentLang = localStorage.getItem('preferredLanguage') || 'en';
            if (button.getAttribute('data-lang') === currentLang) {
                button.classList.add('active');
            }
        });
    </script>
</body>
</html>
